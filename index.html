<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scan1_145 — Scan Viewer</title>
    <style>
      /* White, not black: the intro (splash + charlesv.xyz page) is white,
         and this is what's visible during the brief window before any JS
         has painted anything over it — src/intro.ts's overlay also sets its
         own inline white background so it never has to wait on splash.html's
         fetched stylesheet to stop being transparent. */
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 10;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfcfcf; background: rgba(0,0,0,0.45);
        padding: 8px 10px; border-radius: 6px; pointer-events: none;
        white-space: pre;
        /* Base hidden state — src/intro.ts's finish() drives opacity to 1
           then back to 0 on its own timer, and sets the transition duration
           itself (HUD_HINT_FADE_MS) so there's one source of truth for it. */
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading scan1_145.glb…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
