<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>charlesv.xyz — now</title>
<style>
  @font-face {
    font-family: "Iosevka Fixed SS12";
    src: url("/fonts/IosevkaFixedSS12-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }

  :root { color-scheme: light; }
  * { box-sizing: border-box; }

  /* This page renders into the monitor's screen quad (~1.74:1) in the 3D
     scene, at a fixed raster size — there's no scrolling once it's placed,
     so it just centers a single line/status in the middle of the frame. */
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    color: #000;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Iosevka Fixed SS12", ui-monospace, monospace;
  }

  #status {
    width: 100%;
    text-align: center;
  }

  .small {
    font-size: 6vw;
    line-height: 1.1;
  }

  .big {
    font-size: 15vw;
    font-weight: 700;
    line-height: 1.05;
    word-break: break-word;
  }

  .duration {
    font-variant-numeric: tabular-nums;
  }

  .idle {
    opacity: 0.6;
  }
</style>
</head>
<body>
<div id="status">&nbsp;</div>

<script>
  const API_URL = "https://time-tracker.charles1victorio.workers.dev/current";
  const statusEl = document.getElementById("status");

  // Drop leading zero-valued units (e.g. just "5s", or "3m 4s"), but
  // always keep seconds so it never renders empty.
  function formatDuration(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const days = Math.floor(s / 86400);
    const hours = Math.floor((s % 86400) / 3600);
    const minutes = Math.floor((s % 3600) / 60);
    const seconds = s % 60;

    const parts = [];
    if (days > 0) parts.push(`${days}d`);
    if (days > 0 || hours > 0) parts.push(`${hours}h`);
    if (days > 0 || hours > 0 || minutes > 0) parts.push(`${minutes}m`);
    parts.push(`${seconds}s`);
    return parts.join(" ");
  }

  // baselineSeconds is the server's own already-correct elapsed count at
  // fetch time (deducted_seconds already applied). From there, ticking
  // forward uses performance.now() — a local monotonic clock — instead of
  // recomputing against Date.now() each second. Recomputing against
  // Date.now() every tick means any skew between this machine's wall clock
  // and the API server's clock (a few seconds is common, doesn't need to be
  // much) shows up directly as error in the displayed duration every single
  // tick — clamped to 0 by formatDuration whenever local time reads earlier
  // than the server's start time, so it visibly "sticks at 0s" until real
  // elapsed time finally exceeds the skew. performance.now() has no
  // relationship to wall-clock time at all, so it isn't affected by that
  // skew no matter how large it is.
  function renderTracking(activity, baselineSeconds) {
    const activityLabel = String(activity).toLowerCase();
    statusEl.innerHTML =
      `<div class="small">I've been</div>` +
      `<div class="big activity">${activityLabel}</div>` +
      `<div class="small">for</div>` +
      `<div class="big duration" id="duration"></div>`;
    const durationEl = document.getElementById("duration");
    const localStart = performance.now();

    function tick() {
      const localElapsed = (performance.now() - localStart) / 1000;
      durationEl.textContent = formatDuration(baselineSeconds + localElapsed);
    }

    tick();
    setInterval(tick, 1000);
  }

  function renderIdle() {
    statusEl.innerHTML = `<div class="big idle">Not currently tracking</div>`;
  }

  async function init() {
    try {
      const res = await fetch(API_URL);
      if (res.status === 204) {
        renderIdle();
        return;
      }
      if (!res.ok) {
        renderIdle();
        return;
      }
      const data = await res.json();
      if (!data || !data.activity || !data.starttime) {
        renderIdle();
        return;
      }
      // Trust the server's own figure — it was only ever reading wrong
      // because an upstream device's clock (only NTP-syncs at boot) was
      // recording a bad starttime, not because this field itself is
      // unreliable. Fall back to deriving it locally only if the API
      // response is ever missing it outright.
      const baselineSeconds =
        typeof data.effective_seconds === "number"
          ? data.effective_seconds
          : Math.max(0, (Date.now() - new Date(data.starttime).getTime()) / 1000 - (data.deducted_seconds || 0));
      renderTracking(data.activity, baselineSeconds);
    } catch (err) {
      renderIdle();
    }
  }

  init();
</script>
</body>
</html>
